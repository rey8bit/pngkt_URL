    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
    
      body {
        font-family: 'Inter', sans-serif;
        position: relative;
        background-color: #041d58;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: url('https://rey8bit.github.io/pngkt_URL/chihiro.webp');
        background-size: contain;
        background-position: right;
        background-repeat: no-repeat;
        opacity: 0.25;
        z-index: 0;
        pointer-events: none;
      }

      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(to right, #0f172a 45%, transparent 85%);
        z-index: -1;
        pointer-events: none;
      }

      #root {
        position: relative;
        z-index: 1;
      }
      
      @media (max-width: 1024px) {
        body::before {
          background-position: right;
        }
        body::after {
          background: linear-gradient(to top, #0f172a 15%, transparent 70%);
        }
      }

      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .animate-shimmer {
        background: linear-gradient(to right, #1e293b 4%, #334155 25%, #1e293b 36%);
        background-size: 2000px 100%;
        animation: shimmer 2s infinite linear;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      @keyframes fadeOut {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(0.98); }
      }
      .animate-fade-out {
        animation: fadeOut 0.3s ease-in forwards;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.5); 
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(71, 85, 105, 0.8); 
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 1); 
      }
    </style>
